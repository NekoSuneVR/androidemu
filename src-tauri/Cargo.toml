[package]
name = "nekodroid"
version = "0.1.0"
description = "NekoDroid desktop launcher and Android runtime control plane"
authors = ["NekoSuneVR"]
edition = "2021"

[lib]
name = "nekodroid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
