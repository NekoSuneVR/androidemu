plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.co.nekosunevr.nekodroid.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.nekosunevr.nekodroid.remote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
